version: "3.9"

# jinamem cloud stack
# Usage:
#   cp .env.example .env
#   docker compose -f docker-compose.cloud.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jinamem
      POSTGRES_USER: jinamem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinamem"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://jinamem:${POSTGRES_PASSWORD}@db:5432/jinamem
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-https://jinamem.dev}
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    command: node packages/api/dist/migrate.js
    environment:
      DATABASE_URL: postgres://jinamem:${POSTGRES_PASSWORD}@db:5432/jinamem
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
